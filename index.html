<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Log in or register for Job Analytics, a job application management and analytics portal for job seekers in Malaysia.">
  <title>Login &amp; Register - Job Analytics</title>

  <!-- Favicon: logo + fallback SVG inline -->
  <link rel="icon" type="image/png" href="image/logo_website.png">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23090d10'/%3E%3Cpath d='M12 44l14-14 10 10 16-20' fill='none' stroke='%23a78bfa' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="shortcut icon" href="image/logo_website.png">

  <!-- Apply the saved theme immediately (prevents flicker) -->
  <script>try { document.documentElement.setAttribute("data-bs-theme", localStorage.getItem("theme") || "dark"); } catch (e) {}</script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-protected="false">

  <canvas id="bgCanvas" aria-hidden="true"></canvas>

  <!-- Theme toggle (the login page has no navigation) -->
  <header class="theme-fixed">
    <button type="button" class="btn btn-neon" id="themeToggle" aria-label="Toggle theme"><i class="fa-solid fa-sun"></i></button>
  </header>

  <main class="auth-wrapper">
    <section class="card auth-card p-4" aria-label="User Verification">
      <header class="brand">
        <img src="image/logo_website.png" alt="Logo Job Analytics" class="auth-logo d-block mx-auto mb-2" onerror="this.style.display='none'">JOB<span>ANALYTICS</span>
      </header>

      <!-- Alert feedback (alert-danger / alert-success / alert-info) -->
      <div id="alertBox" class="alert d-none" role="alert"></div>

      <!-- ============ LOGIN FORM ============ -->
      <form id="loginForm">
        <p class="text-center text-secondary small mb-4">Log in to your job analysis portal for admin password : admin123</p>

        <div class="mb-3">
          <label for="loginEmail" class="form-label">Email or Username</label>
          <input type="text" class="form-control" id="loginEmail" placeholder="admin@jobanalytics.com" autocomplete="username" required>
        </div>

        <div class="mb-3">
          <label for="loginPassword" class="form-label">Password</label>
          <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe">
            <label class="form-check-label small text-secondary" for="rememberMe">Remember My Email</label>
          </div>
          <a href="#" id="forgotPasswordLink" class="small">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-neon w-100 py-2">LOG IN</button>

        <!-- Quick access for the lecturer -->
        <button type="button" id="demoLoginBtn" class="btn btn-secondary-dark w-100 py-2 mt-3">
          <i class="fa-solid fa-bolt me-1"></i> (Demo Login)
        </button>

        <p class="text-center small text-secondary mt-4 mb-0">
          Don't have an account yet? <a href="#" id="showRegisterBtn" class="fw-semibold text-decoration-none">Register New Account</a>
        </p>
      </form>

      <!-- ============ REGISTER FORM ============ -->
      <form id="registerForm" class="d-none">
        <p class="text-center text-secondary small mb-4">Register for a new job seeker account</p>

        <div class="mb-3">
          <label for="regFullName" class="form-label">Full Name</label>
          <input type="text" class="form-control" id="regFullName" placeholder="Ahmad Zaki" required>
        </div>
        <div class="mb-3">
          <label for="regUsername" class="form-label">Username</label>
          <input type="text" class="form-control" id="regUsername" placeholder="zaki2026" autocomplete="username" required>
        </div>
        <div class="mb-3">
          <label for="regEmail" class="form-label">Email Address</label>
          <input type="email" class="form-control" id="regEmail" placeholder="zaki@example.com" autocomplete="email" required>
        </div>
        <div class="mb-3">
          <label for="regPhone" class="form-label">Phone Number</label>
          <input type="tel" class="form-control" id="regPhone" placeholder="+60 12-345 6789" required>
        </div>
        <div class="mb-3">
          <label for="regPassword" class="form-label">Password (min. 6 characters)</label>
          <input type="password" class="form-control" id="regPassword" placeholder="••••••••" autocomplete="new-password" required>
        </div>
        <div class="mb-3">
          <label for="regConfirmPassword" class="form-label">Confirm Password</label>
          <input type="password" class="form-control" id="regConfirmPassword" placeholder="••••••••" autocomplete="new-password" required>
        </div>

        <button type="submit" class="btn btn-neon w-100 py-2">REGISTER ACCOUNT</button>

        <p class="text-center small text-secondary mt-4 mb-0">
          Already registered? <a href="#" id="showLoginBtn" class="fw-semibold text-decoration-none">Back to Login</a>
        </p>
      </form>
    </section>
  </main>

  <!-- ============ FORGOT PASSWORD MODAL ============ -->
  <div class="modal fade" id="forgotModal" tabindex="-1" aria-labelledby="forgotTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="forgotTitle">Reset Password</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="forgotForm">
          <div class="modal-body">
            <div id="forgotAlert" class="alert d-none" role="alert"></div>
            <div class="mb-3">
              <label for="forgotEmail" class="form-label">Email or Username</label>
              <input type="text" class="form-control" id="forgotEmail" required>
            </div>
            <div class="mb-3">
              <label for="forgotNewPassword" class="form-label">New Password (min. 6 characters)</label>
              <input type="password" class="form-control" id="forgotNewPassword" autocomplete="new-password" required>
            </div>
            <div class="mb-1">
              <label for="forgotConfirmPassword" class="form-label">Confirm New Password</label>
              <input type="password" class="form-control" id="forgotConfirmPassword" autocomplete="new-password" required>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary-dark" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-neon">Reset Password</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
